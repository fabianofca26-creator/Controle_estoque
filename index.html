a{color:var(--tx);text-decoration-color:var(--tx3)}

@media print{
  header,nav,.noprint{display:none!important}

<script>
// ---------- leitura do pedido (PDF do Sienge) e da planilha de quantitativos ----------
// Funções puras: o parser.test.mjs roda elas no Node com os arquivos reais.
// <parser>
// O Sienge gera dois modelos: "Emissão de Pedido de Compra" (cada item numa linha)
// e "Ordem de Compra" (item "COD - NOME" com o complemento nas linhas de baixo e a
// data de entrega meia linha abaixo). Os dois têm o cabeçalho "Insumo ... Quant".
const numBR = s => +String(s).replace(/\./g, "").replace(",", ".");
const dataISO = s => s.split("/").reverse().join("-");
const semCodigo = s => s.replace(/^\d+\s*-\s*/, "").trim();
function linhasPdf(itens) {
  const ls = [];
  for (const it of itens.filter(i => i.s.trim()).sort((a, b) => b.y - a.y || a.x - b.x)) {
    let l = ls.find(l => Math.abs(l.y - it.y) <= 1.5);
    if (!l) ls.push(l = { y: it.y, t: [] });
    l.t.push({ x: it.x, s: it.s.trim() });
  }
  ls.forEach(l => l.t.sort((a, b) => a.x - b.x));
  return ls.sort((a, b) => b.y - a.y);
}
function lerPedido(paginas) {
  const p = { num: "", data: "", fornecedor: "", obra: "", unidade: "", itens: [] };
  const DATA = /^\d{2}\/\d{2}\/\d{4}$/;
  let item = null;
  paginas.forEach((pag, n) => {
    const ls = linhasPdf(pag);
    let naTabela = false, depoisFornecedor = false, depoisUnidade = false;
    for (const l of ls) {
      const ss = l.t.map(t => t.s), apos = rot => { const i = ss.indexOf(rot); return i >= 0 && i + 1 < ss.length ? ss[i + 1] : null; };
      if (ss.some(s => s.includes("SIENGE"))) continue; // rodapé: tem data e hora de emissão
      if (n === 0) {
        if (!p.num && (apos("Pedido:") || apos("Pedido"))) { p.num = apos("Pedido:") || apos("Pedido"); p.data = dataISO(ss.find(s => DATA.test(s)) || ""); }
        if (/^(Dados do fornecedor|Fornecedor)/.test(ss[0])) depoisFornecedor = true;
        else if (depoisFornecedor && (apos("Razão social:") || apos("Nome"))) { p.fornecedor = semCodigo(apos("Razão social:") || apos("Nome")); depoisFornecedor = false; }
        if (!p.obra && (apos("Obra:") || apos("Obra"))) p.obra = semCodigo(apos("Obra:") || apos("Obra"));
        if (depoisUnidade) { p.unidade = semCodigo(ss[0]); depoisUnidade = false; }
        if (ss[0] === "Unidade construtiva") depoisUnidade = true;
      }
      if (ss[0].startsWith("Insumo") && ss.some(s => s.startsWith("Quant"))) { naTabela = true; continue; }
      if (!naTabela) continue;
      if (/^(Cond|Total)/.test(ss[0])) { naTabela = false; continue; }
      const cab = l.t[0].s.match(/^(\d+)\s*-\s*(.+)$/);
      const iq = ss.findIndex((s, i) => i > 0 && /^[\d.]+,\d+(\s+\S+)?$/.test(s));
      if (cab && iq > 0) {
        const [q, un] = ss[iq].split(/\s+/);
        item = { cod: cab[1], nome: cab[2].trim(), comp: "", qtd: numBR(q), un: un || ss[iq + 1] || "", prev: "" };
        p.itens.push(item);
      } else if (item && l.t.every(t => t.x < 250) && !ss.some(s => DATA.test(s))) {
        item.comp = (item.comp + " " + ss.join(" ")).trim();
        continue;
      }
      const d = ss.find(s => DATA.test(s));
      if (item && d && !item.prev) item.prev = dataISO(d);
    }
  });
  return p;
}
// Planilha de quantitativos: cada aba tem à direita um bloco por modelo de casa
// (MODELO, FASE, Insumo, Unidade, "Quantidade de insumos em projeto" = por casa,
// CÓDIGO SIENGE). As colunas mudam de lugar entre abas, então acha pelo cabeçalho.
function lerQuantitativo(abas) {
  const out = [];
  const n = v => String(v ?? "").replace(/\s+/g, " ").trim().toUpperCase();
  for (const { nome: aba, linhas } of abas) {
    const h = (linhas[0] || []).map(n);
    const cM = h.indexOf("MODELO");
    const ini = cM >= 0 ? cM : h.indexOf("ITEM", 1); // sem MODELO: o bloco começa no segundo "Item"
    if (ini < 0) continue;
    const col = re => h.findIndex((c, j) => j >= ini && re.test(c));
    const cF = col(/^FASE$/), cI = col(/^INSUMO/), cU = col(/^UNIDADE/), cQ = col(/^QUANTIDADE DE INSUMOS/), cC = col(/^C[OÓ]DIGO/);
    if (cI < 0 || cQ < 0) continue;
    // aba sem nenhuma linha do modelo 2 = o material é igual nos dois tipos (modelo 0)
    const temM2 = cM >= 0 && linhas.some((l, i) => i && +l[cM] === 2);
    for (const l of linhas.slice(1)) {
      const qtd = +l[cQ], nome = String(l[cI] ?? "").replace(/\s+/g, " ").trim();
      // só linhas com MODELO (ou Item) preenchido: abaixo da tabela tem rascunhos de conta
      if (!(+l[ini] > 0) || !nome || !(qtd > 0)) continue;
      out.push({ aba, modelo: temM2 ? +l[cM] || 1 : 0, fase: cF >= 0 ? String(l[cF] ?? "").trim() : "", nome,
        un: cU >= 0 ? String(l[cU] ?? "").trim() : "", cod: cC >= 0 ? String(l[cC] ?? "").replace(/\s+/g, "") : "", qtd });
    }
  }
  return out;
}
// </parser>

// ---------- dados ----------
// material: {id, nome, cod ("797-2"), un, grupo, c1, c2 (consumo por casa tipo 1/2, na unidade da planilha),
//            unQ (unidade da planilha), fator (planilha × fator = unidade do estoque), locais:[id], conf (data), apelidos:[chave do pedido]}
// mov: {id, data, tipo: entrada|saida|transf|ajuste|anterior, mat, qtd, mod?, obra?, ped?, obs?}
//   ajuste guarda a diferença com sinal; "anterior" = já usado no módulo antes do app (não mexe no estoque)
// solic: {id, num, data, obs, fechada, itens:[{mat, qtd}]}
// pedido: {id, num, data, fornecedor, obra, etapa, solic, fechado, itens:[{mat, qtd, prev, desc}]}
const KEY = "estoque-obra";
const vazio = () => ({ materiais: [], locais: [], modulos: [], movs: [], solics: [], pedidos: [], config: { driveClientId: "" }, meta: { salvoEm: null, backup: null } });
function migrar(d) { const v = vazio(); for (const k in v) d[k] ??= v[k]; return d; }
let S = migrar(JSON.parse(localStorage.getItem(KEY) || "null") || vazio());
function save() { S.meta.salvoEm = new Date().toISOString(); localStorage.setItem(KEY, JSON.stringify(S)); agendarSync(); }

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const hoje = () => new Date().toLocaleDateString("sv");
const fmt = d => d ? d.split("-").reverse().join("/") : "";
const dias = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const fN = v => (+v || 0).toLocaleString("pt-BR", { maximumFractionDigits: 2 });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mat = id => S.materiais.find(m => m.id === id);
const nomeMat = id => mat(id)?.nome || "(material removido)";
const unMat = id => mat(id)?.un || "";
const chaveItem = it => it.cod + "|" + (it.nome + " " + it.comp).replace(/\s+/g, " ").trim().toUpperCase();
const rotuloMat = m => (m.cod ? m.cod + " · " : "") + m.nome;
const porNome = (a, b) => a.nome.localeCompare(b.nome);
const previsto = (m, mod) => ((+mod.t1 || 0) * (+m.c1 || 0) + (+mod.t2 || 0) * (+m.c2 || 0)) * (+m.fator || 1);

// ---------- contas ----------
// comprar = falta usar nos módulos − estoque − pedido a chegar − solicitação ainda sem pedido
function calc() {
  const soma = (o, k, v) => o[k] = (o[k] || 0) + v;
  const saldo = {}, saidoMod = {}, receb = {}, pedidoSol = {}, aChegar = {}, solAberta = {}, falta = {}, comprar = {};
  for (const m of S.movs) {
    if (m.tipo !== "anterior") soma(saldo, m.mat, m.tipo === "entrada" || m.tipo === "ajuste" ? m.qtd : -m.qtd);
    if ((m.tipo === "saida" || m.tipo === "anterior") && m.mod) soma(saidoMod, m.mod + "|" + m.mat, m.qtd);
    if (m.tipo === "entrada" && m.ped) soma(receb, m.ped + "|" + m.mat, m.qtd);
  }
  for (const p of S.pedidos) for (const it of p.itens) {
    if (p.solic) soma(pedidoSol, p.solic + "|" + it.mat, it.qtd);
    const f = it.qtd - (receb[p.id + "|" + it.mat] || 0);
    if (!p.fechado && f > 0) soma(aChegar, it.mat, f);
  }
  for (const s of S.solics) if (!s.fechada) for (const it of s.itens) {
    const f = it.qtd - (pedidoSol[s.id + "|" + it.mat] || 0);
    if (f > 0) soma(solAberta, it.mat, f);
  }
  for (const m of S.materiais) for (const mod of S.modulos) {
    const f = previsto(m, mod) - (saidoMod[mod.id + "|" + m.id] || 0);
    if (f > 0) soma(falta, m.id, f);
  }
  for (const m of S.materiais) {
    const c = (falta[m.id] || 0) - Math.max(0, saldo[m.id] || 0) - (aChegar[m.id] || 0) - (solAberta[m.id] || 0);
    if (c > 1e-6) comprar[m.id] = c;
  }
  return { saldo, saidoMod, receb, pedidoSol, aChegar, solAberta, falta, comprar };
}
// pedido: quanto falta chegar por item e o estado
function estadoPedido(p, C) {
  const itens = p.itens.map(it => ({ ...it, rec: C.receb[p.id + "|" + it.mat] || 0 }));
  const falta = itens.some(i => i.rec < i.qtd - 1e-9), algum = itens.some(i => i.rec > 0);
  const atrasado = !p.fechado && falta && itens.some(i => i.rec < i.qtd && i.prev && i.prev < hoje());
  const st = p.fechado ? (falta ? "encerrado" : "recebido") : !falta ? "recebido" : algum ? "parcial" : "aguardando";
  return { itens, st, atrasado };
}
const tagPedido = (e) => `<span class="tag ${e.st === "recebido" ? "ok" : e.st === "encerrado" ? "" : "wa"}">${e.st}</span>${e.atrasado ? '<span class="tag er">atrasado</span>' : ""}`;

// ---------- navegação ----------
let tela = "painel", sel = null, pilha = [];
let aba = { materiais: "lista", compras: "comprar" }, busca = "", grupoSel = "", localConf = "";
function ir(t, id) {
  if (["painel", "materiais", "compras", "conferir", "ajustes"].includes(t)) pilha = [];
  else pilha.push([tela, sel]);
  tela = t; sel = id ?? null; render(); scrollTo(0, 0);
}
function voltar() { [tela, sel] = pilha.pop() || ["painel", null]; render(); }
function render() {
  const C = calc();
  btVoltar.classList.toggle("hide", !pilha.length);
  nav.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", b.dataset.t === (pilha[0]?.[0] || tela)));
  subtit.textContent = "";
  app.innerHTML = { painel, materiais, material, compras, solic, pedido, conferir, ajustes }[tela](C);
  if (tela === "materiais") listaMat(C);
  cabecalho();
}
function titulo(t, s) { document.getElementById("titulo").textContent = t; subtit.textContent = s || ""; }

// ---------- painel ----------
function painel(C) {
  titulo("Estoque da Obra", S.materiais.length + " materiais");
  if (!S.materiais.length) return `<div class="card"><p>Comece por <b>Ajustes</b>: cadastre os módulos (casas tipo 1 e tipo 2), os locais de armazenamento e importe a planilha de quantitativos.</p>
    <p class="muted">Depois, em <b>Compras</b>, importe os pedidos do Sienge em PDF.</p><button class="btn" onclick="ir('ajustes')">Ir para Ajustes</button></div>`;
  const comprar = Object.entries(C.comprar).sort((a, b) => nomeMat(a[0]).localeCompare(nomeMat(b[0])));
  const atrasados = S.pedidos.map(p => [p, estadoPedido(p, C)]).filter(([, e]) => e.atrasado);
  const semConf = S.materiais.filter(m => (C.saldo[m.id] || 0) > 0).sort((a, b) => (a.conf || "").localeCompare(b.conf || "")).slice(0, 8);
  const ub = S.meta.backup;
  return `<div class="row" style="margin-bottom:12px"><button class="btn" onclick="dlgSaida()">Lançar saída</button></div>
  <div class="card"><div class="row"><h3 style="margin:0">Precisa comprar</h3><span class="n big">${comprar.length}</span></div>
    ${comprar.slice(0, 8).map(([id, q]) => `<div class="it" onclick="ir('material','${id}')"><span class="lb">${esc(nomeMat(id))}</span><span class="q">${fN(q)} ${esc(unMat(id))}</span></div>`).join("") || `<p class="muted">Nada por enquanto.</p>`}
    ${comprar.length ? `<button class="btn sec" style="margin-top:8px" onclick="aba.compras='comprar';ir('compras')">Ver tudo e gerar solicitação</button>` : ""}</div>
  ${atrasados.length ? `<div class="card"><h3>Pedidos atrasados</h3>${atrasados.map(([p]) => `<div class="it" onclick="ir('pedido','${p.id}')"><span class="lb">Pedido ${esc(p.num)}<small>${esc(p.fornecedor)}</small></span><span class="tag er">atrasado</span></div>`).join("")}</div>` : ""}
  <div class="card"><h3>Há mais tempo sem conferir</h3>
    ${semConf.map(m => `<div class="it" onclick="ir('material','${m.id}')"><span class="lb">${esc(m.nome)}<small>${esc(locaisDe(m))}</small></span><span class="q">${m.conf ? "há " + dias(m.conf, hoje()) + " dias" : '<span class="tag wa">nunca</span>'}</span></div>`).join("") || `<p class="muted">Nenhum material com saldo.</p>`}
    <button class="btn sec" style="margin-top:8px" onclick="ir('conferir')">Fazer conferência</button></div>
  <p class="muted" style="color:${ub && dias(ub, hoje()) < 15 ? "var(--tx3)" : "var(--wa-tx)"}">${ub ? "Último backup: " + fmt(ub) + " (há " + dias(ub, hoje()) + " dias)" : "Você nunca exportou backup."}</p>`;
}
const locaisDe = m => (m.locais || []).map(id => S.locais.find(l => l.id === id)?.nome).filter(Boolean).join(", ") || "sem local";

// ---------- materiais ----------
function materiais() {
  titulo("Materiais", S.materiais.length + " cadastrados");
  const grupos = [...new Set(S.materiais.map(m => m.grupo).filter(Boolean))].sort();
  return `<div class="seg noprint"><button aria-pressed="${aba.materiais === "lista"}" onclick="aba.materiais='lista';render()">Lista</button><button aria-pressed="${aba.materiais === "local"}" onclick="aba.materiais='local';render()">Onde está</button></div>
  <div class="row noprint" style="margin-bottom:10px"><input id="qBusca" placeholder="Buscar nome ou código" value="${esc(busca)}" oninput="busca=this.value;listaMat()">
    <select class="n" style="width:40%" onchange="grupoSel=this.value;listaMat()"><option value="">Todos os grupos</option>${grupos.map(g => `<option ${g === grupoSel ? "selected" : ""}>${esc(g)}</option>`).join("")}</select></div>
  ${aba.materiais === "local" ? `<button class="btn sec noprint" style="margin-bottom:10px" onclick="print()">Imprimir</button>` : `<button class="btn sec noprint" style="margin-bottom:10px" onclick="dlgMaterial()">+ Material avulso</button>`}
  <div id="lm"></div>`;
}
function listaMat(C = calc()) {
  const q = busca.trim().toUpperCase();
  const ms = S.materiais.filter(m => (!grupoSel || m.grupo === grupoSel) && (!q || (m.nome + " " + m.cod).toUpperCase().includes(q))).sort(porNome);
  const linha = m => `<div class="it" onclick="ir('material','${m.id}')"><span class="lb">${esc(m.nome)}<small>${esc([m.cod, m.grupo].filter(Boolean).join(" · "))}${aba.materiais === "lista" ? " · " + esc(locaisDe(m)) : ""}</small></span>
    <span class="q">${fN(C.saldo[m.id])} ${esc(m.un)}${C.comprar[m.id] ? `<small style="color:var(--wa-tx)">comprar ${fN(C.comprar[m.id])}</small>` : ""}</span></div>`;
  if (aba.materiais === "lista") { lm.innerHTML = `<div class="card">${ms.map(linha).join("") || `<p class="empty">Nenhum material.</p>`}</div>`; return; }
  // onde está: só o que tem saldo, agrupado por local
  const comSaldo = ms.filter(m => (C.saldo[m.id] || 0) > 0);
  const grupos = [...S.locais.map(l => [l.nome, comSaldo.filter(m => m.locais?.includes(l.id))]), ["Sem local", comSaldo.filter(m => !m.locais?.length)]];
  lm.innerHTML = grupos.filter(([, ms]) => ms.length).map(([nome, ms]) => `<h2>${esc(nome)}</h2><div class="card">${ms.map(linha).join("")}</div>`).join("") || `<p class="empty">Nenhum material com saldo.</p>`;
}

function material(C) {
  const m = mat(sel); if (!m) { voltar(); return ""; }
  titulo(m.nome, [m.cod, m.grupo].filter(Boolean).join(" · "));
  const movs = S.movs.filter(x => x.mat === m.id).sort((a, b) => b.data.localeCompare(a.data));
  const rotMov = x => ({ entrada: "Entrada" + (x.ped ? " · pedido " + esc(S.pedidos.find(p => p.id === x.ped)?.num || "") : ""), saida: "Saída · " + esc(S.modulos.find(o => o.id === x.mod)?.nome || ""), transf: "Transferência · " + esc(x.obra), ajuste: "Ajuste de conferência", anterior: "Já usado antes do app · " + esc(S.modulos.find(o => o.id === x.mod)?.nome || "") }[x.tipo]);
  return `<div class="card"><span class="muted">Em estoque</span><div class="big">${fN(C.saldo[m.id])} <span style="font-size:16px">${esc(m.un)}</span></div>
    <p class="muted" style="margin:6px 0 0">${esc(locaisDe(m))} · ${m.conf ? "conferido em " + fmt(m.conf) + " (há " + dias(m.conf, hoje()) + " dias)" : "nunca conferido"}</p></div>
  <div class="kpis"><div><b>${fN(C.aChegar[m.id])}</b><span>a chegar (pedidos)</span></div><div><b>${fN(C.solAberta[m.id])}</b><span>solicitado sem pedido</span></div>
    <div><b>${fN(C.falta[m.id])}</b><span>falta usar nos módulos</span></div><div><b style="color:${C.comprar[m.id] ? "var(--wa-tx)" : "inherit"}">${fN(C.comprar[m.id])}</b><span>precisa comprar</span></div></div>
  <div class="row" style="margin-bottom:12px"><button class="btn" onclick="dlgSaida('${m.id}')">Saída</button><button class="btn sec" onclick="dlgMaterial('${m.id}')">Editar</button></div>
  ${S.modulos.length ? `<h2>Previsão por módulo</h2><div class="card"><table><tr><th>Módulo</th><th>Previsto</th><th>Já saiu</th><th>Falta</th></tr>
    ${S.modulos.map(o => { const p = previsto(m, o), s = C.saidoMod[o.id + "|" + m.id] || 0; return `<tr><td>${esc(o.nome)}</td><td>${fN(p)}</td><td>${fN(s)}</td><td>${fN(Math.max(0, p - s))}</td></tr>`; }).join("")}</table>
    <p class="muted" style="margin:8px 0 0">Por casa: tipo 1 = ${fN(m.c1)} · tipo 2 = ${fN(m.c2)} ${esc(m.unQ || m.un)}${(+m.fator || 1) !== 1 ? " · fator " + fN(m.fator) : ""}</p></div>` : ""}
  <h2>Histórico</h2><div class="card">${movs.map(x => `<div class="it" style="cursor:default"><span class="lb">${rotMov(x)}<small>${fmt(x.data)}${x.obs ? " · " + esc(x.obs) : ""}</small></span>
    <span class="q">${x.tipo === "entrada" || (x.tipo === "ajuste" && x.qtd > 0) ? "+" : x.tipo === "anterior" ? "" : "−"}${fN(Math.abs(x.qtd))}</span><button class="icobtn" aria-label="Apagar" onclick="apagarMov('${x.id}')"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>`).join("") || `<p class="muted">Sem movimentações.</p>`}</div>`;
}
function apagarMov(id) { if (!confirm("Apagar este lançamento?")) return; S.movs = S.movs.filter(x => x.id !== id); save(); render(); }

function dlgMaterial(id) {
  const m = id ? mat(id) : { nome: "", cod: "", un: "", grupo: "", c1: 0, c2: 0, unQ: "", fator: 1, locais: [] };
  D.innerHTML = `<form onsubmit="event.preventDefault();salvarMaterial('${id || ""}')"><h3>${id ? "Editar material" : "Material avulso"}</h3>

    <div class="field"><label>Grupo</label><input id="mGrupo" value="${esc(m.grupo)}"></div>
    <div class="row field"><div><label>Por casa · tipo 1</label><input id="mC1" type="number" step="any" min="0" value="${m.c1 || 0}"></div><div><label>Por casa · tipo 2</label><input id="mC2" type="number" step="any" min="0" value="${m.c2 || 0}"></div></div>
    <div class="row field"><div><label>Unidade da planilha</label><input id="mUnQ" value="${esc(m.unQ)}"></div><div><label>Fator (planilha → estoque)</label><input id="mFator" type="number" step="any" min="0" value="${m.fator || 1}"></div></div>
    <div class="field"><label>Onde está guardado</label>${S.locais.map(l => `<label class="row" style="color:var(--tx);font-size:15px;margin:6px 0"><input type="checkbox" class="n" name="mLoc" value="${l.id}" ${m.locais?.includes(l.id) ? "checked" : ""}><span>${esc(l.nome)}</span></label>`).join("") || `<p class="muted">Cadastre os locais em Ajustes.</p>`}</div>

function salvarMaterial(id) {
  const m = id ? mat(id) : { id: uid(), apelidos: [] };
  Object.assign(m, { nome: mNome.value.trim(), cod: mCod.value.trim(), un: mUn.value.trim(), grupo: mGrupo.value.trim(), c1: +mC1.value || 0, c2: +mC2.value || 0,
    unQ: mUnQ.value.trim(), fator: +mFator.value || 1, locais: [...D.querySelectorAll("[name=mLoc]:checked")].map(i => i.value) });
  if (!id) S.materiais.push(m);
  save(); D.close(); id ? render() : ir("material", m.id);
}
function excluirMaterial(id) {
  if (S.movs.some(x => x.mat === id) || S.pedidos.some(p => p.itens.some(i => i.mat === id)) || S.solics.some(s => s.itens.some(i => i.mat === id)))
    return alert("Esse material tem lançamentos, pedidos ou solicitações. Não dá pra excluir.");
  if (!confirm("Excluir o material?")) return;
  S.materiais = S.materiais.filter(m => m.id !== id); save(); D.close(); voltar();
}

// ---------- saída ----------
const optsMat = () => S.materiais.slice().sort(porNome).map(m => `<option value="${esc(rotuloMat(m))}">`).join("");
const matPorRotulo = t => S.materiais.find(m => rotuloMat(m) === t.trim()) || S.materiais.find(m => m.nome.toUpperCase() === t.trim().toUpperCase());
function dlgSaida(id) {
  const m = id && mat(id), C = calc();
  D.innerHTML = `<form onsubmit="event.preventDefault();salvarSaida(event.submitter?.value)"><h3>Saída de material</h3>
    <div class="field"><label>Material</label><input id="sMat" list="dlMat" required autocomplete="off" value="${m ? esc(rotuloMat(m)) : ""}" oninput="saldoSaida()"><datalist id="dlMat">${optsMat()}</datalist><span class="sub" id="sSaldo"></span></div>
    <div class="row field"><div><label>Quantidade</label><input id="sQtd" type="number" step="any" min="0" required></div><div><label>Data</label><input id="sData" type="date" required value="${hoje()}"></div></div>
    <div class="field"><label>Para onde</label><select id="sDest" onchange="sObraW.classList.toggle('hide',this.value!=='transf')">
      ${S.modulos.map(o => `<option value="${o.id}">${esc(o.nome)}</option>`).join("")}<option value="transf">Transferência para outra obra</option>
      ${S.modulos.map(o => `<option value="ant:${o.id}">${esc(o.nome)} · já usado antes do app (não mexe no estoque)</option>`).join("")}</select></div>
    <div class="field hide" id="sObraW"><label>Obra de destino</label><input id="sObra" list="dlObras"><datalist id="dlObras">${[...new Set(S.movs.map(x => x.obra).filter(Boolean))].map(o => `<option value="${esc(o)}">`).join("")}</datalist></div>
    <div class="field"><label>Observação</label><input id="sObs"></div>
    <div class="row"><button type="button" class="btn sec" onclick="D.close()">Fechar</button><button class="btn sec" value="outra">Salvar e lançar outra</button><button class="btn" value="ok">Salvar</button></div></form>`;
  D.showModal(); saldoSaida();
  if (!S.modulos.length) sObraW.classList.remove("hide");
  (m ? sQtd : sMat).focus();
}
function saldoSaida() { const m = matPorRotulo(sMat.value); sSaldo.textContent = m ? `Em estoque: ${fN(calc().saldo[m.id])} ${m.un}` : ""; }
function salvarSaida(modo) {
  const m = matPorRotulo(sMat.value);
  if (!m) return alert("Escolha um material da lista.");
  const qtd = +sQtd.value; if (!(qtd > 0)) return alert("Informe a quantidade.");
  const d = sDest.value, mv = { id: uid(), data: sData.value, mat: m.id, qtd, obs: sObs.value.trim() };
  if (d === "transf") { if (!sObra.value.trim()) return alert("Informe a obra de destino."); Object.assign(mv, { tipo: "transf", obra: sObra.value.trim() }); }
  else if (d.startsWith("ant:")) Object.assign(mv, { tipo: "anterior", mod: d.slice(4) });
  else Object.assign(mv, { tipo: "saida", mod: d });
  S.movs.push(mv); save();
  if (modo === "outra") { sMat.value = ""; sQtd.value = ""; sObs.value = ""; sSaldo.textContent = "Lançado. Próximo material:"; sMat.focus(); render(); }
  else { D.close(); render(); }
}

// ---------- compras: precisa comprar, solicitações, pedidos ----------
function compras(C) {
  titulo("Compras");
  const a = aba.compras;
  const seg = `<div class="seg"><button aria-pressed="${a === "comprar"}" onclick="aba.compras='comprar';render()">Comprar</button><button aria-pressed="${a === "solics"}" onclick="aba.compras='solics';render()">Solicitações</button><button aria-pressed="${a === "pedidos"}" onclick="aba.compras='pedidos';render()">Pedidos</button></div>`;
  if (a === "comprar") {
    const ls = Object.entries(C.comprar).map(([id, q]) => [mat(id), q]).sort((x, y) => porNome(x[0], y[0]));
    return seg + `<p class="muted">Falta usar nos módulos − estoque − pedidos a chegar − solicitações sem pedido.</p>
      ${ls.length ? `<div class="card">${ls.map(([m, q]) => `<label class="it"><input type="checkbox" class="n" name="cp" value="${m.id}" checked><span class="lb">${esc(m.nome)}<small>${esc(m.cod)}</small></span>
        <input class="cnt" type="number" step="any" min="0" id="cq_${m.id}" value="${+q.toFixed(2)}"><span class="n muted" style="width:44px">${esc(m.un)}</span></label>`).join("")}</div>
      <button class="btn" onclick="criarSolic()">Criar solicitação com os marcados</button>` : `<p class="empty">Nada a comprar.</p>`}`;
  }
  if (a === "solics") {
    const ss = S.solics.slice().sort((x, y) => y.data.localeCompare(x.data));
    return seg + `<button class="btn" style="margin-bottom:12px" onclick="criarSolic(true)">+ Nova solicitação</button>
      <div class="card">${ss.map(s => { const f = s.itens.filter(i => i.qtd - (C.pedidoSol[s.id + "|" + i.mat] || 0) > 1e-9).length;
        return `<div class="it" onclick="ir('solic','${s.id}')"><span class="lb">Solicitação ${esc(s.num || "(sem número)")}<small>${fmt(s.data)} · ${s.itens.length} itens</small></span>
        <span class="tag ${s.fechada || !f ? "ok" : "wa"}">${s.fechada ? "fechada" : f ? f + " sem pedido" : "atendida"}</span></div>`; }).join("") || `<p class="muted">Nenhuma solicitação.</p>`}</div>`;
  }
  const ps = S.pedidos.slice().sort((x, y) => y.data.localeCompare(x.data));
  return seg + `<button class="btn" style="margin-bottom:12px" onclick="fPdf.click()">Importar pedido (PDF do Sienge)</button>
    <div class="card">${ps.map(p => `<div class="it" onclick="ir('pedido','${p.id}')"><span class="lb">Pedido ${esc(p.num)}<small>${esc(p.fornecedor)} · ${fmt(p.data)}${p.etapa ? " · " + esc(p.etapa) : ""}</small></span><span class="q">${tagPedido(estadoPedido(p, C))}</span></div>`).join("") || `<p class="muted">Nenhum pedido.</p>`}</div>`;
}
function criarSolic(vazia) {
  const itens = vazia ? [] : [...document.querySelectorAll("[name=cp]:checked")].map(i => ({ mat: i.value, qtd: +document.getElementById("cq_" + i.value).value || 0 })).filter(i => i.qtd > 0);
  if (!vazia && !itens.length) return alert("Marque pelo menos um material.");
  const num = prompt("Número da solicitação no Sienge (pode deixar em branco e preencher depois):");
  if (num === null) return;
  const s = { id: uid(), num: num.trim(), data: hoje(), obs: "", itens };
  S.solics.push(s); save(); ir("solic", s.id);
}
function solic(C) {
  const s = S.solics.find(x => x.id === sel); if (!s) { voltar(); return ""; }
  titulo("Solicitação " + (s.num || "(sem número)"), fmt(s.data) + (s.fechada ? " · fechada" : ""));
  const peds = S.pedidos.filter(p => p.solic === s.id);
  return `<div class="card"><table><tr><th>Material</th><th>Pedido</th><th>Solicitado</th><th></th></tr>
    ${s.itens.map((i, k) => `<tr><td>${esc(nomeMat(i.mat))}<span class="sub">${esc(mat(i.mat)?.cod)}</span></td><td>${fN(C.pedidoSol[s.id + "|" + i.mat])}</td>
      <td><input class="cnt" style="width:90px" type="number" step="any" min="0" value="${i.qtd}" onchange="S.solics.find(x=>x.id==='${s.id}').itens[${k}].qtd=+this.value||0;save();render()"> ${esc(unMat(i.mat))}</td>
      <td><button class="icobtn" aria-label="Tirar" onclick="tirarItemSolic(${k})"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></td></tr>`).join("") || `<tr><td colspan="4" class="muted">Sem itens.</td></tr>`}</table>
    <form class="row" style="margin-top:10px" onsubmit="event.preventDefault();addItemSolic()"><input id="aiMat" list="dlMat" placeholder="Adicionar material" autocomplete="off"><datalist id="dlMat">${optsMat()}</datalist>
      <input id="aiQtd" class="n" style="width:90px" type="number" step="any" min="0" placeholder="Qtd"><button class="btn sm n">+</button></form></div>
  ${peds.length ? `<h2>Pedidos ligados</h2><div class="card">${peds.map(p => `<div class="it" onclick="ir('pedido','${p.id}')"><span class="lb">Pedido ${esc(p.num)}<small>${esc(p.fornecedor)}</small></span></div>`).join("")}</div>` : ""}
  <div class="field"><label>Observação</label><input value="${esc(s.obs)}" onchange="S.solics.find(x=>x.id==='${s.id}').obs=this.value;save()"></div>
  <div class="row" style="margin-bottom:10px"><button class="btn sec" onclick="copiarSolic()">Copiar lista</button><button class="btn sec" onclick="numSolic()">Número Sienge</button></div>
  <div class="row"><button class="btn sec" onclick="fecharSolic()">${s.fechada ? "Reabrir" : "Fechar solicitação"}</button><button class="btn dan" onclick="excluirSolic()">Excluir</button></div>`;
}
const solAtual = () => S.solics.find(x => x.id === sel);
function addItemSolic() {
  const m = matPorRotulo(aiMat.value); if (!m) return alert("Escolha um material da lista.");
  const q = +aiQtd.value; if (!(q > 0)) return alert("Informe a quantidade.");
  solAtual().itens.push({ mat: m.id, qtd: q }); save(); render(); document.getElementById("aiMat").focus();
}
function tirarItemSolic(k) { solAtual().itens.splice(k, 1); save(); render(); }
function numSolic() { const n = prompt("Número da solicitação no Sienge:", solAtual().num); if (n !== null) { solAtual().num = n.trim(); save(); render(); } }
function fecharSolic() { solAtual().fechada = !solAtual().fechada; save(); render(); }
function excluirSolic() {
  if (!confirm("Excluir esta solicitação?")) return;
  S.pedidos.forEach(p => { if (p.solic === sel) p.solic = null; });
  S.solics = S.solics.filter(x => x.id !== sel); save(); voltar();
}
function copiarSolic() {
  const t = solAtual().itens.map(i => { const m = mat(i.mat); return `${m?.cod || "-"}\t${m?.nome}\t${fN(i.qtd)}\t${m?.un}`; }).join("\n");
  navigator.clipboard.writeText(t).then(() => alert("Lista copiada (código, nome, quantidade, unidade)."), () => prompt("Copie a lista:", t));
}

// ---------- pedido: importar PDF ----------
let novoPed = null;
async function importarPdf(f) {
  if (!f) return;
  let p;
  try {
    const pdfjs = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
    pdfjs.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
    const doc = await pdfjs.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
    const pags = [];
    for (let i = 1; i <= doc.numPages; i++) pags.push((await (await doc.getPage(i)).getTextContent()).items.map(t => ({ x: t.transform[4], y: t.transform[5], s: t.str })));
    p = lerPedido(pags);
  } catch (e) { return alert("Não consegui abrir o PDF: " + e.message); }
  if (!p.itens.length) return alert("Não encontrei itens nesse PDF. É um pedido do Sienge?");
  if (S.pedidos.some(x => x.num === p.num) && !confirm(`O pedido ${p.num} já foi importado. Importar de novo?`)) return;
  // sugestão de material: equivalência já gravada; senão, o único material com o mesmo código de insumo
  p.itens.forEach(it => {
    it.chave = chaveItem(it);

// Contagem por local; o estoque é um só, então o material só é ajustado quando
// foi contado em todos os locais onde está. Contou 0 num local = saiu de lá.
let contagem = {}; // mat -> {local -> qtd}
function conferir(C) {
  titulo("Conferência", "conte o que tem em cada local");
  const locs = [...S.locais.map(l => [l.id, l.nome]), ["_", "Sem local"]].filter(([id]) => !localConf || id === localConf);
  const lista = locs.map(([lid, nome]) => {
    const ms = S.materiais.filter(m => lid === "_" ? !m.locais?.length && (C.saldo[m.id] || 0) > 0 : m.locais?.includes(lid)).sort(porNome);
    return ms.length ? `<h2>${esc(nome)}</h2><div class="card">${ms.map(m => `<div class="it" style="cursor:default"><span class="lb">${esc(m.nome)}
      <small>no app: ${fN(C.saldo[m.id])} ${esc(m.un)}${m.locais?.length > 1 ? " (somando " + esc(locaisDe(m)) + ")" : ""} · ${m.conf ? "conferido há " + dias(m.conf, hoje()) + " dias" : "nunca conferido"}</small></span>
      <input class="cnt" type="number" step="any" min="0" placeholder="contado" value="${contagem[m.id]?.[lid] ?? ""}" oninput="(contagem['${m.id}']??={})['${lid}']=this.value"></div>`).join("")}</div>` : "";
  }).join("");
  return `<div class="field"><select onchange="localConf=this.value;render()"><option value="">Todos os locais</option>${S.locais.map(l => `<option value="${l.id}" ${l.id === localConf ? "selected" : ""}>${esc(l.nome)}</option>`).join("")}<option value="_" ${localConf === "_" ? "selected" : ""}>Sem local</option></select></div>
    ${lista || `<p class="empty">Nenhum material aqui.</p>`}
    ${lista ? `<button class="btn" onclick="salvarConferencia()">Salvar conferência</button>` : ""}`;
}
function salvarConferencia() {
  const C = calc(), ajustados = [], faltam = [];
  for (const [id, cs] of Object.entries(contagem)) {
    const m = mat(id); if (!m) continue;
    const locs = m.locais?.length ? m.locais : ["_"];
    if (!locs.some(l => cs[l] !== undefined && cs[l] !== "")) continue;
    const semContar = locs.filter(l => cs[l] === undefined || cs[l] === "");
    if (semContar.length) { faltam.push(`${m.nome}: falta contar em ${semContar.map(l => S.locais.find(x => x.id === l)?.nome || "sem local").join(", ")}`); continue; }
    const total = locs.reduce((t, l) => t + (+cs[l] || 0), 0), dif = total - (C.saldo[id] || 0);
    if (Math.abs(dif) > 1e-9) S.movs.push({ id: uid(), data: hoje(), tipo: "ajuste", mat: id, qtd: dif, obs: `contado ${fN(total)}, app dizia ${fN(C.saldo[id])}` });
    if (m.locais?.length) m.locais = m.locais.filter(l => +cs[l] > 0);
    m.conf = hoje(); ajustados.push(`${m.nome}: ${Math.abs(dif) > 1e-9 ? (dif > 0 ? "+" : "") + fN(dif) : "ok"}`);
    delete contagem[id];
  }
  if (!ajustados.length && !faltam.length) return alert("Nenhuma contagem preenchida.");
  save(); render();
  alert((ajustados.length ? "Conferidos:\n" + ajustados.join("\n") : "") + (faltam.length ? "\n\nNão salvos (o material está em mais de um local):\n" + faltam.join("\n") : ""));
}

let quant = null;
async function importarQuant(f) {
  if (!f) return;
  try {
    if (!window.XLSX) await new Promise((ok, erro) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = ok; s.onerror = () => erro(new Error("sem internet?")); document.head.append(s); });
    const wb = XLSX.read(await f.arrayBuffer());
    quant = lerQuantitativo(wb.SheetNames.map(n => ({ nome: n, linhas: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, blankrows: false }) })));
  } catch (e) { return alert("Não consegui ler a planilha: " + e.message); }
  if (!quant.length) return alert("Não encontrei o bloco \"Quantidade de insumos em projeto\" em nenhuma aba.");
  const abas = Object.entries(Object.groupBy(quant, l => l.aba));
  D.innerHTML = `<form onsubmit="event.preventDefault();aplicarQuant()"><h3>Planilha de quantitativos</h3>
    <p class="muted" style="margin-top:-6px">Marque as abas que entram. Se o mesmo material aparece em mais de uma aba marcada, as quantidades por casa se somam.</p>
    ${abas.map(([a, ls]) => `<label class="it"><input type="checkbox" class="n" name="qa" value="${esc(a)}" checked><span class="lb">${esc(a)}<small>${ls.length} linhas</small></span></label>`).join("")}
    <div class="row" style="margin-top:12px"><button type="button" class="btn sec" onclick="D.close()">Cancelar</button><button class="btn">Importar</button></div></form>`;
  D.showModal();
}
function aplicarQuant() {
  const abas = new Set([...D.querySelectorAll("[name=qa]:checked")].map(i => i.value));
  const tot = new Map(); // chave (código ou nome) -> {linha, c1, c2}
  for (const l of quant.filter(l => abas.has(l.aba))) {
    const k = l.cod || l.nome.toUpperCase();
    const t = tot.get(k) || { l, c1: 0, c2: 0 }; tot.set(k, t);
    if (l.modelo === 0 || l.modelo === 1) t.c1 += l.qtd;
    if (l.modelo === 0 || l.modelo === 2) t.c2 += l.qtd; // ponytail: modelo 3 (só no esgoto) fica de fora até ter casa tipo 3
  }
  let novos = 0, atual = 0;
  for (const [k, { l, c1, c2 }] of tot) {
    let m = S.materiais.find(m => l.cod ? m.cod === l.cod : !m.cod && m.nome.toUpperCase() === k);
    if (!m) { m = { id: uid(), nome: l.nome, cod: l.cod, un: l.un, grupo: l.aba, fator: 1, locais: [], apelidos: [] }; S.materiais.push(m); novos++; } else atual++;
    Object.assign(m, { c1: +c1.toFixed(4), c2: +c2.toFixed(4), unQ: l.un }); m.grupo ||= l.aba;
  }
  save(); D.close(); render();
  alert(`${novos} materiais novos, ${atual} atualizados.`);
}

// ---------- google drive (mesmo esquema do app de Assistência) ----------
// ponytail: última versão ganha, sem mesclagem por registro. Usuário único;
// sincroniza ao abrir e 3 s depois de cada alteração.
const DRIVE = { estado: "off", erro: "", quando: null, timer: null };
const SCOPE = "https://www.googleapis.com/auth/drive.file";
function tokenValido() {
  try { const t = JSON.parse(sessionStorage.getItem("estoque_tok") || "null"); return t && t.exp > Date.now() + 60000 ? t.tok : null; } catch (e) { return null; }
}
function conectar() {
  return new Promise((res, rej) => {
    if (!S.config.driveClientId) return rej(new Error("informe o Client ID nos ajustes"));
    if (!window.google || !google.accounts) return rej(new Error("biblioteca do Google não carregou (sem internet?)"));
    google.accounts.oauth2.initTokenClient({
      client_id: S.config.driveClientId, scope: SCOPE,
      callback: r => {
        if (r.error) return rej(new Error(r.error));
        sessionStorage.setItem("estoque_tok", JSON.stringify({ tok: r.access_token, exp: Date.now() + r.expires_in * 1000 }));
        res(r.access_token);
      },
      error_callback: e => rej(new Error(e.type === "popup_closed" ? "janela fechada" : e.type || "erro"))
    }).requestAccessToken({ prompt: "" });
  });
}
async function dapi(path, opts = {}, upload = false) {
  const tok = tokenValido(); if (!tok) throw new Error("não conectado");
  const r = await fetch((upload ? "https://www.googleapis.com/upload/drive/v3/" : "https://www.googleapis.com/drive/v3/") + path,
    Object.assign({}, opts, { headers: Object.assign({ Authorization: "Bearer " + tok }, opts.headers || {}) }));
  if (r.status === 401) { sessionStorage.removeItem("estoque_tok"); throw new Error("sessão expirou, conecte de novo"); }
  if (!r.ok) { let msg = ""; try { msg = (await r.json()).error.message; } catch (e) { } throw new Error("Drive respondeu " + r.status + (msg ? ": " + msg : "")); }
  return r;
}
const dBuscar = async (nome, pasta) => {
  const q = `name='${nome}' and trashed=false` + (pasta ? ` and '${pasta}' in parents` : "");
  return (await (await dapi("files?q=" + encodeURIComponent(q) + "&fields=files(id,modifiedTime)")).json()).files[0] || null;
};
async function dCriar(nome, blob, pasta, mime) {
  const meta = { name: nome, parents: pasta ? [pasta] : [] };
  if (!blob) meta.mimeType = "application/vnd.google-apps.folder";
  const fd = new FormData();
  fd.append("metadata", new Blob([JSON.stringify(meta)], { type: "application/json" }));
  if (blob) fd.append("file", new Blob([blob], { type: mime }));
  const r = await dapi(blob ? "files?uploadType=multipart&fields=id" : "files?fields=id", { method: "POST", body: blob ? fd : JSON.stringify(meta), headers: blob ? {} : { "Content-Type": "application/json" } }, !!blob);
  return (await r.json()).id;
}
const dAtualizar = (id, blob, mime) => dapi("files/" + id + "?uploadType=media", { method: "PATCH", body: blob, headers: { "Content-Type": mime } }, true);
async function sincronizar(interativo) {
  if (DRIVE.estado === "busy") return;
  let mudou = false;
  try {
    if (!tokenValido()) { if (!interativo) return; await conectar(); }
    DRIVE.estado = "busy"; cabecalho();
    const p = await dBuscar("Controle de Estoque"), pasta = p ? p.id : await dCriar("Controle de Estoque", null);
    const arq = await dBuscar("estoque.json", pasta);
    let subir = !arq;
    if (arq) {
      const remoto = migrar(JSON.parse(await (await dapi("files/" + arq.id + "?alt=media")).text()));
      const rs = remoto.meta.salvoEm || "", ls = S.meta.salvoEm || "";
      if (rs > ls) { remoto.config.driveClientId ||= S.config.driveClientId; S = remoto; localStorage.setItem(KEY, JSON.stringify(S)); mudou = true; }
      else if (ls > rs) subir = true;
    }
    if (subir) {
      const blob = new Blob([JSON.stringify(S)], { type: "application/json" });
      if (arq) await dAtualizar(arq.id, blob, "application/json"); else await dCriar("estoque.json", blob, pasta, "application/json");
    }
    DRIVE.estado = "sync"; DRIVE.quando = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  } catch (e) {
    DRIVE.estado = tokenValido() ? "err" : "off"; DRIVE.erro = e.message;
    if (interativo) alert("Não sincronizou: " + e.message);
  }
  if (mudou || tela === "ajustes") render(); else cabecalho();
}
function agendarSync() {
  if (!tokenValido()) return;
  clearTimeout(DRIVE.timer);
  DRIVE.timer = setTimeout(() => sincronizar(false), 3000);
}
function cabecalho() {
  btnDrive.className = "icobtn " + DRIVE.estado;
  btnDrive.title = { off: "Conectar ao Google Drive", sync: "Sincronizado" + (DRIVE.quando ? " às " + DRIVE.quando : ""), busy: "Sincronizando…", err: "Erro: " + DRIVE.erro }[DRIVE.estado];
}
btnDrive.onclick = () => { if (!S.config.driveClientId) { ir("ajustes"); return alert("Cole o Client ID do Google nos ajustes pra conectar ao Drive."); } sincronizar(true); };
