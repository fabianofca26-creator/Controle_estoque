<script>
// ---------- leitura do pedido (PDF do Sienge) ----------
// Função pura: o parser.test.mjs roda ela no Node com os PDFs reais.
// <parser>
// O Sienge gera dois modelos: "Emissão de Pedido de Compra" (cada item numa linha)
// e "Ordem de Compra" (item "COD - NOME" com o complemento nas linhas de baixo e a
// data de entrega meia linha abaixo). Os dois têm o cabeçalho "Insumo ... Quant".
const numBR = s => +String(s).replace(/\./g, "").replace(",", ".");
const dataISO = s => s.split("/").reverse().join("-");
const semCodigo = s => s.replace(/^\d+\s*-\s*/, "").trim();
function linhasPdf(itens) {
  const ls = [];
  for (const it of itens.filter(i => i.s.trim()).sort((a, b) => b.y - a.y || a.x - b.x)) {
    let l = ls.find(l => Math.abs(l.y - it.y) <= 1.5);
    if (!l) ls.push(l = { y: it.y, t: [] });
    l.t.push({ x: it.x, s: it.s.trim() });
  }
  ls.forEach(l => l.t.sort((a, b) => a.x - b.x));
  return ls.sort((a, b) => b.y - a.y);
}
function lerPedido(paginas) {
  const p = { num: "", data: "", fornecedor: "", obra: "", unidade: "", itens: [] };
  const DATA = /^\d{2}\/\d{2}\/\d{4}$/;
  let item = null;
  paginas.forEach((pag, n) => {
    const ls = linhasPdf(pag);
    let naTabela = false, depoisFornecedor = false, depoisUnidade = false;
    for (const l of ls) {
      const ss = l.t.map(t => t.s), apos = rot => { const i = ss.indexOf(rot); return i >= 0 && i + 1 < ss.length ? ss[i + 1] : null; };
      if (ss.some(s => s.includes("SIENGE"))) continue; // rodapé: tem data e hora de emissão
      if (n === 0) {
        if (!p.num && (apos("Pedido:") || apos("Pedido"))) { p.num = apos("Pedido:") || apos("Pedido"); p.data = dataISO(ss.find(s => DATA.test(s)) || ""); }
        if (/^(Dados do fornecedor|Fornecedor)/.test(ss[0])) depoisFornecedor = true;
        else if (depoisFornecedor && (apos("Razão social:") || apos("Nome"))) { p.fornecedor = semCodigo(apos("Razão social:") || apos("Nome")); depoisFornecedor = false; }
        if (!p.obra && (apos("Obra:") || apos("Obra"))) p.obra = semCodigo(apos("Obra:") || apos("Obra"));
        if (depoisUnidade) { p.unidade = semCodigo(ss[0]); depoisUnidade = false; }
        if (ss[0] === "Unidade construtiva") depoisUnidade = true;
      }
      if (ss[0].startsWith("Insumo") && ss.some(s => s.startsWith("Quant"))) { naTabela = true; continue; }
      if (!naTabela) continue;
      if (/^(Cond|Total)/.test(ss[0])) { naTabela = false; continue; }
      const cab = l.t[0].s.match(/^(\d+)\s*-\s*(.+)$/);
      const iq = ss.findIndex((s, i) => i > 0 && /^[\d.]+,\d+(\s+\S+)?$/.test(s));
      if (cab && iq > 0) {
        const [q, un] = ss[iq].split(/\s+/);
        item = { cod: cab[1], nome: cab[2].trim(), comp: "", qtd: numBR(q), un: un || ss[iq + 1] || "", prev: "" };
        p.itens.push(item);
      } else if (item && l.t.every(t => t.x < 250) && !ss.some(s => DATA.test(s))) {
        item.comp = (item.comp + " " + ss.join(" ")).trim();
        continue;
      }
      const d = ss.find(s => DATA.test(s));
      if (item && d && !item.prev) item.prev = dataISO(d);
    }
  });
  return p;
}
// </parser>

// ---------- dados ----------
// Comum a todas as obras: materiais, fornecedores, config. O resto (OBRA_DADOS) é da obra
// atual e fica no topo de S; as outras obras ficam guardadas em S.obras[id] e trocam de lugar
// no trocarObra — assim o resto do código só enxerga a obra atual.
// material: {id, nome, cod ("797-2"), un, fator (quantidade por casa × fator = unidade do estoque),
//            forn (fornecedor), locais:[id de local de qualquer obra], confs:{obra: data da última conferência}, apelidos:[chave do item no pedido]}
// servico: {id, nome, etapa, apos (serviço que vem antes; "" = começa livre), itens:[{mat, q1, q2}]} — a ordem do array é a sequência
// modulo: {id, nome, t1, t2, feitas:{servico: casas prontas}, base:{servico: casas prontas antes do controle de estoque}}
// mov: {id, data, tipo: entrada|saida|transf|ajuste, mat, qtd, mod?, serv?, obra?, ped?, obs?} — ajuste guarda a diferença com sinal
// solic: {id, num, data, obs, fechada, itens:[{mat, qtd}]}
// pedido: {id, num, data, fornecedor, obra, etapa, solic, fechado, itens:[{mat, qtd, prev, desc}]}
// fornecedor: {id, nome, prazo (dias)}
// prog: {"modulo|servico": {ini (casas prontas quando foi programado), q: {"2026-11-01": casas a executar na quinzena}}}
const KEY = "estoque-obra";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const OBRA_DADOS = ["servicos", "locais", "modulos", "movs", "solics", "pedidos", "prog"];
const dadosObra = () => ({ servicos: [], locais: [], modulos: [], movs: [], solics: [], pedidos: [], prog: {} });
const vazio = () => ({ materiais: [], fornecedores: [], ...dadosObra(), obra: { id: uid(), nome: "Obra principal" }, obras: {}, config: { driveClientId: "" }, meta: { salvoEm: null, backup: null } });
function migrar(d) {
  const v = vazio(); for (const k in v) d[k] ??= v[k];
  d.modulos.forEach(o => { o.feitas ??= {}; o.base ??= {}; });
  // conferência era uma data só; agora é por obra
  d.materiais.forEach(m => { if (typeof m.conf === "string") (m.confs ??= {})[d.obra.id] = m.conf; delete m.conf; });
  return d;
}
let S = migrar(JSON.parse(localStorage.getItem(KEY) || "null") || vazio());
function save() { S.meta.salvoEm = new Date().toISOString(); localStorage.setItem(KEY, JSON.stringify(S)); agendarSync(); }

// ---------- obras ----------
const listaObras = () => [S.obra, ...Object.entries(S.obras).map(([id, o]) => ({ id, nome: o.nome }))].sort(porNome);
const dadosDe = id => id === S.obra.id ? S : S.obras[id]; // os dados de qualquer obra (a atual está no topo de S)
function trocarObra(id) {
  if (id === S.obra.id || !S.obras[id]) return;
  const guardar = { nome: S.obra.nome }; OBRA_DADOS.forEach(k => guardar[k] = S[k]);
  S.obras[S.obra.id] = guardar;
  const o = S.obras[id]; delete S.obras[id];
  S.obra = { id, nome: o.nome }; OBRA_DADOS.forEach(k => S[k] = o[k] ?? dadosObra()[k]);
  migrar(S); contagem = {}; localConf = ""; aba.mod = ""; aba.fMod = ""; aba.fServ = "";
  save(); ir("painel");
}
const confDe = m => m.confs?.[S.obra.id] || "";
const localDaObra = id => S.locais.some(l => l.id === id);
const locsDe = m => (m.locais || []).filter(localDaObra);
const hoje = () => new Date().toLocaleDateString("sv");
const fmt = d => d ? d.split("-").reverse().join("/") : "";
const dias = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const fN = v => (+v || 0).toLocaleString("pt-BR", { maximumFractionDigits: 2 });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mat = id => S.materiais.find(m => m.id === id);
const serv = id => S.servicos.find(s => s.id === id);
const modu = id => S.modulos.find(o => o.id === id);
const nomeMat = id => mat(id)?.nome || "(material removido)";
const unMat = id => mat(id)?.un || "";
const chaveItem = it => it.cod + "|" + (it.nome + " " + it.comp).replace(/\s+/g, " ").trim().toUpperCase();
const rotuloMat = m => (m.cod ? m.cod + " · " : "") + m.nome;
const porNome = (a, b) => a.nome.localeCompare(b.nome);
const etapas = () => [...new Set(S.servicos.map(s => s.etapa || "Sem etapa"))];
const prazoDe = m => S.fornecedores.find(f => f.id === m?.forn);

// ---------- andamento ----------
const totCasas = o => (+o.t1 || 0) + (+o.t2 || 0);
const feitas = (o, s) => Math.min(totCasas(o), +o.feitas?.[s.id] || 0);
// ponytail: o andamento é um número por serviço (não separa tipo 1 e 2), então a quantidade
// por casa é a média do módulo. Se precisar, guardar as casas prontas por tipo.
const porCasa = (it, o) => { const t = totCasas(o); return t ? ((+o.t1 || 0) * (+it.q1 || 0) + (+o.t2 || 0) * (+it.q2 || 0)) / t * (+mat(it.mat)?.fator || 1) : 0; };
function cadeia(s) { const c = [s]; while (c.at(-1).apos) { const p = serv(c.at(-1).apos); if (!p || c.includes(p)) break; c.push(p); } return c; }
// casas que faltam fazer o serviço, por distância da frente: [0] = já liberadas (o serviço
// anterior está pronto), [1] = esperando 1 serviço, ... o último nível são as que nem começaram a cadeia
function niveis(o, s) {
  const c = cadeia(s), f = c.map(x => feitas(o, x));
  return c.map((_, k) => Math.max(0, (k + 1 < c.length ? f[k + 1] : totCasas(o)) - f[k]));
}

// ---------- programação por quinzena (dia 1 a 15 e 16 ao fim do mês) ----------
const quinz = d => d.slice(0, 8) + (+d.slice(8, 10) < 16 ? "01" : "16");
const qIdx = q => { const [y, m, d] = q.split("-").map(Number); return y * 24 + (m - 1) * 2 + (d >= 16 ? 1 : 0); };
const proxQ = q => { const [y, m] = q.split("-").map(Number); return q.endsWith("01") ? q.slice(0, 8) + "16" : m === 12 ? `${y + 1}-01-01` : `${y}-${String(m + 1).padStart(2, "0")}-01`; };
const fimQ = q => { const [y, m] = q.split("-").map(Number); return q.slice(0, 8) + (q.endsWith("01") ? "15" : new Date(y, m, 0).getDate()); };
const fmtQ = q => `${fmt(q).slice(0, 5)} a ${fmt(fimQ(q)).slice(0, 5)}`;
// faixa da quinzena contando da atual: 0 = agora, 1 = próxima... ; 99 = casas sem programação
const faixa = q => q ? Math.min(97, Math.max(0, qIdx(q) - qIdx(quinz(hoje())))) : 99;
// casas programadas que ainda faltam, por quinzena. As casas prontas desde a programação abatem
// as quinzenas mais antigas primeiro; o que ficou pra trás passa pra quinzena atual (atrasado).
function programado(o, s) {
  const g = S.prog[o.id + "|" + s.id], r = {}, atual = quinz(hoje());
  let atras = 0;
  if (g) {
    let feito = Math.max(0, feitas(o, s) - g.ini), pend = Math.max(0, totCasas(o) - feitas(o, s));
    for (const q of Object.keys(g.q).sort()) {
      let c = +g.q[q] || 0; const u = Math.min(feito, c); feito -= u;
      c = Math.min(c - u, pend); pend -= c;
      if (c <= 0) continue;
      if (q < atual) atras += c;
      r[q < atual ? atual : q] = (r[q < atual ? atual : q] || 0) + c;
    }
  }
  return { partes: Object.entries(r).sort().map(([q, casas]) => ({ q, casas })), atras };
}
const HORIZ = [[0, "Quinzena atual"], [1, "Até 15 dias"], [2, "Até 30 dias"], [97, "Tudo programado"], [99, "Tudo que falta"]];
const menos = (d, n) => new Date(Date.parse(d + "T12:00") - n * 864e5).toLocaleDateString("sv");

// ---------- contas ----------
// Demanda = casas que faltam × quantidade por casa, por módulo/serviço/quinzena programada
// (casas sem programação ficam na faixa 99). O que tem (estoque + a chegar + solicitado) é
// reservado primeiro pra quinzena mais próxima, depois pela ordem da sequência; o que sobra
// sem cobertura é o que falta comprar.
function calc() {
  const soma = (o, k, v) => o[k] = (o[k] || 0) + v;
  const saldo = {}, saiu = {}, receb = {}, pedidoSol = {}, aChegar = {}, solAberta = {}, falta = {}, esperado = {}, disp = {};
  for (const m of S.movs) {
    soma(saldo, m.mat, m.tipo === "entrada" || m.tipo === "ajuste" ? m.qtd : -m.qtd);
    if (m.tipo === "saida" && m.mod) soma(saiu, m.mod + "|" + m.mat, m.qtd);
    if (m.tipo === "entrada" && m.ped) soma(receb, m.ped + "|" + m.mat, m.qtd);
  }
  for (const p of S.pedidos) for (const it of p.itens) {
    if (p.solic) soma(pedidoSol, p.solic + "|" + it.mat, it.qtd);
    const f = it.qtd - (receb[p.id + "|" + it.mat] || 0);
    if (!p.fechado && f > 0) soma(aChegar, it.mat, f);
  }
  for (const s of S.solics) if (!s.fechada) for (const it of s.itens) {
    const f = it.qtd - (pedidoSol[s.id + "|" + it.mat] || 0);
    if (f > 0) soma(solAberta, it.mat, f);
  }
  const dem = [];
  S.modulos.forEach((o, mi) => S.servicos.forEach((s, si) => {
    const pend = Math.max(0, totCasas(o) - feitas(o, s)), { partes } = programado(o, s);
    const resto = pend - partes.reduce((t, p) => t + p.casas, 0);
    if (resto > 0) partes.push({ q: "", casas: resto });
    for (const it of s.itens) {
      const qc = porCasa(it, o); if (!(qc > 0)) continue;
      for (const p of partes) dem.push({ mod: o.id, sv: s.id, mat: it.mat, q: p.q, b: faixa(p.q), casas: p.casas, qtd: p.casas * qc, ord: si, mi });
      soma(esperado, o.id + "|" + it.mat, Math.max(0, feitas(o, s) - (+o.base?.[s.id] || 0)) * qc);
    }
  }));
  dem.sort((a, b) => a.b - b.b || a.ord - b.ord || a.mi - b.mi);
  for (const m of S.materiais) disp[m.id] = Math.max(0, saldo[m.id] || 0) + (aChegar[m.id] || 0) + (solAberta[m.id] || 0);
  for (const d of dem) {
    soma(falta, d.mat, d.qtd);
    const usa = Math.min(disp[d.mat] || 0, d.qtd);
    disp[d.mat] = (disp[d.mat] || 0) - usa; d.falta = d.qtd - usa;
  }
  return { saldo, saiu, receb, pedidoSol, aChegar, solAberta, falta, esperado, dem };
}
// falta comprar por material até o horizonte escolhido
function comprarAte(C, hz) {
  const r = {};
  for (const d of C.dem) if (d.b <= hz && d.falta > 1e-6) r[d.mat] = (r[d.mat] || 0) + d.falta;
  return r;
}

function estadoPedido(p, C) {

  const falta = itens.some(i => i.rec < i.qtd - 1e-9), algum = itens.some(i => i.rec > 0);
  const atrasado = !p.fechado && falta && itens.some(i => i.rec < i.qtd && i.prev && i.prev < hoje());
  const st = p.fechado ? (falta ? "encerrado" : "recebido") : !falta ? "recebido" : algum ? "parcial" : "aguardando";
  return { itens, st, atrasado };
}

const matPorRotulo = t => S.materiais.find(m => rotuloMat(m) === t.trim()) || S.materiais.find(m => m.nome.toUpperCase() === t.trim().toUpperCase());

// o serviço: primeiro os que usam o material, depois o resto
function saldoSaida() {

  sSaldo.textContent = m ? `Em estoque: ${fN(C.saldo[m.id])} ${m.un}` : "";

function salvarSaida(modo) {
  const m = matPorRotulo(sMat.value);
  if (!m) return alert("Escolha um material da lista.");
  const qtd = +sQtd.value; if (!(qtd > 0)) return alert("Informe a quantidade.");
  const mv = { id: uid(), data: sData.value, mat: m.id, qtd, obs: sObs.value.trim() };
  if (sDest.value === "transf") {
    const nome = sObra.value.trim(); if (!nome) return alert("Informe a obra de destino.");
    Object.assign(mv, { tipo: "transf", obra: nome });
    const dest = listaObras().find(o => o.id !== S.obra.id && o.nome.toUpperCase() === nome.toUpperCase());
    if (dest) dadosDe(dest.id).movs.push({ id: uid(), data: mv.data, tipo: "entrada", mat: m.id, qtd, obs: "transferência de " + S.obra.nome + (mv.obs ? " · " + mv.obs : "") });
  }
  else Object.assign(mv, { tipo: "saida", mod: sDest.value, serv: sServ.value || undefined });
  S.movs.push(mv); save();
  if (modo === "outra") { sMat.value = ""; sQtd.value = ""; sObs.value = ""; saldoSaida(); sSaldo.textContent = "Lançado. Próximo material:"; sMat.focus(); render(); }
  else { D.close(); render(); }
}

// ---------- compras: indicação, solicitações, pedidos ----------
function compras(C) {
  titulo("Compras");
  const a = aba.compras;
  const seg = `<div class="seg"><button aria-pressed="${a === "comprar"}" onclick="aba.compras='comprar';render()">Comprar</button><button aria-pressed="${a === "solics"}" onclick="aba.compras='solics';render()">Solicitações</button><button aria-pressed="${a === "pedidos"}" onclick="aba.compras='pedidos';render()">Pedidos</button></div>`;

    const ss = S.solics.slice().sort((x, y) => y.data.localeCompare(x.data));
    return seg + `<button class="btn" style="margin-bottom:12px" onclick="criarSolic(true)">+ Nova solicitação</button>
      <div class="card">${ss.map(s => { const f = s.itens.filter(i => i.qtd - (C.pedidoSol[s.id + "|" + i.mat] || 0) > 1e-9).length;
        return `<div class="it" onclick="ir('solic','${s.id}')"><span class="lb">Solicitação ${esc(s.num || "(sem número)")}<small>${fmt(s.data)} · ${s.itens.length} itens</small></span>
        <span class="tag ${s.fechada || !f ? "ok" : "wa"}">${s.fechada ? "fechada" : f ? f + " sem pedido" : "atendida"}</span></div>`; }).join("") || `<p class="muted">Nenhuma solicitação.</p>`}</div>`;
  }

    <div class="card">${ps.map(p => `<div class="it" onclick="ir('pedido','${p.id}')"><span class="lb">Pedido ${esc(p.num)}<small>${esc(p.fornecedor)} · ${fmt(p.data)}${p.etapa ? " · " + esc(p.etapa) : ""}</small></span><span class="q">${tagPedido(estadoPedido(p, C))}</span></div>`).join("") || `<p class="muted">Nenhum pedido.</p>`}</div>`;
}
// Indicação de compra: só o que não está coberto pelo que já tem/vem, dentro do horizonte,
// agrupada por etapa e serviço. Um material usado em dois serviços aparece nos dois.
function indicacao(C) {
  const q = aba.fBusca.trim().toUpperCase();
  const ds = C.dem.filter(d => d.falta > 1e-6 && d.b <= aba.hz && (!aba.fMod || d.mod === aba.fMod) && (!aba.fServ || d.sv === aba.fServ)
    && (!aba.fEtapa || (serv(d.sv).etapa || "Sem etapa") === aba.fEtapa) && (!q || (nomeMat(d.mat) + " " + mat(d.mat)?.cod).toUpperCase().includes(q)));
  const grupos = new Map(); // serviço -> material -> {falta, q (quinzena mais cedo; "" = sem programação)}
  for (const d of ds) {
    const g = grupos.get(d.sv) || new Map(); grupos.set(d.sv, g);
    const x = g.get(d.mat) || { falta: 0, q: d.q }; g.set(d.mat, x);
    x.falta += d.falta; if (d.q && (!x.q || d.q < x.q)) x.q = d.q;
  }
  // data limite pra comprar = início da quinzena − prazo do fornecedor
  const quando = (x, f) => {
    if (!x.q) return "sem programação";
    const lim = menos(x.q, f?.prazo || 0);
    return `precisa em ${fmt(x.q).slice(0, 5)} · ` + (lim <= hoje() ? '<span class="tag er">comprar já</span>' : `comprar até ${fmt(lim).slice(0, 5)}`);
  };
  const svs = S.servicos.filter(s => grupos.has(s.id));
  // o que o estoque/a chegar/solicitado já cobre desse material nesse serviço, dentro do horizonte
  const cob = {};
  for (const d of C.dem) if (d.b <= aba.hz && (!aba.fMod || d.mod === aba.fMod)) cob[d.sv + "|" + d.mat] = (cob[d.sv + "|" + d.mat] || 0) + d.qtd - d.falta;
  const filtros = `<div class="filtros">
    <select onchange="aba.hz=+this.value;render()">${HORIZ.map(([v, t]) => `<option value="${v}" ${v === aba.hz ? "selected" : ""}>${t}</option>`).join("")}</select>
    <select onchange="aba.fMod=this.value;render()"><option value="">Todos os módulos</option>${S.modulos.map(o => `<option value="${o.id}" ${o.id === aba.fMod ? "selected" : ""}>${esc(o.nome)}</option>`).join("")}</select>
    <select onchange="aba.fEtapa=this.value;aba.fServ='';render()"><option value="">Todas as etapas</option>${etapas().map(e => `<option ${e === aba.fEtapa ? "selected" : ""}>${esc(e)}</option>`).join("")}</select>
    <select onchange="aba.fServ=this.value;render()"><option value="">Todos os serviços</option>${S.servicos.filter(s => !aba.fEtapa || (s.etapa || "Sem etapa") === aba.fEtapa).map(s => `<option value="${s.id}" ${s.id === aba.fServ ? "selected" : ""}>${esc(s.nome)}</option>`).join("")}</select>
    <input style="grid-column:1/-1" placeholder="Buscar material" value="${esc(aba.fBusca)}" onchange="aba.fBusca=this.value;render()"></div>`;
  return filtros + `<p class="muted">O que já tem em estoque, a chegar e solicitado é reservado primeiro pra quinzena mais próxima. Aqui só aparece o que fica descoberto. Programe os serviços na aba Obra.</p>
    ${svs.map(s => { const { h1, h2 } = casasHz(s);
      return `<div class="card"><h4>${esc(s.nome)}</h4><span class="sub" style="margin-bottom:6px">${esc(s.etapa)}</span>
      <div class="row" style="margin-bottom:4px"><label style="margin:0">Pedir para casas tipo 1</label><input class="cnt n" type="number" min="0" step="1" id="h1_${s.id}" value="${h1}" oninput="recalcSv('${s.id}')">
        <label style="margin:0">tipo 2</label><input class="cnt n" type="number" min="0" step="1" id="h2_${s.id}" value="${h2}" oninput="recalcSv('${s.id}')"></div>
      ${[...grupos.get(s.id)].sort((a, b) => nomeMat(a[0]).localeCompare(nomeMat(b[0]))).map(([mid, x]) => { const m = mat(mid), f = prazoDe(m), it = s.itens.find(i => i.mat === mid), c = cob[s.id + "|" + mid] || 0;
      return `<label class="it"><input type="checkbox" class="n" name="cp" value="${s.id}|${mid}" checked><span class="lb">${esc(m.nome)}<small>${esc(m.cod)} · ${fN(it.q1)} / ${fN(it.q2)} por casa${c > 1e-6 ? ` · já coberto ${fN(c)}` : ""} · ${quando(x, f)}${f?.prazo ? ` · prazo ${f.prazo} dias` : ""}</small></span>
        <input class="cnt" type="number" step="any" min="0" id="cq_${s.id}_${mid}" data-cob="${c}" value="${qtdPedir(it, h1, h2, c)}"><span class="n muted" style="width:40px;font-size:12px">${esc(m.un)}</span></label>`; }).join("")}</div>`; }).join("") || `<p class="empty">Nada a comprar com esses filtros.</p>`}
    ${svs.length ? `<button class="btn" onclick="criarSolic()">Criar solicitação com os marcados</button>` : ""}`;
}
// casas do horizonte, separadas por tipo pela proporção de cada módulo (arredondado pra casa inteira)
function casasHz(s) {
  let h1 = 0, h2 = 0;
  for (const o of S.modulos) {
    const tot = totCasas(o); if (!tot || (aba.fMod && o.id !== aba.fMod)) continue;
    const h = aba.hz >= 99 ? Math.max(0, tot - feitas(o, s)) : programado(o, s).partes.filter(p => faixa(p.q) <= aba.hz).reduce((t, p) => t + p.casas, 0);
    const a = Math.round(h * (+o.t1 || 0) / tot); h1 += a; h2 += h - a;
  }
  return { h1, h2 };
}
// quanto pedir = casas × quantidade por casa de cada tipo − o que já está coberto, arredondado pra cima
const qtdPedir = (it, h1, h2, cob) => Math.max(0, Math.ceil(((+h1 || 0) * (+it.q1 || 0) + (+h2 || 0) * (+it.q2 || 0)) * (+mat(it.mat)?.fator || 1) - cob - 1e-9));
function recalcSv(sid) {
  const s = serv(sid), h1 = document.getElementById("h1_" + sid).value, h2 = document.getElementById("h2_" + sid).value;
  s.itens.forEach(it => { const i = document.getElementById(`cq_${sid}_${it.mat}`); if (i) i.value = qtdPedir(it, h1, h2, +i.dataset.cob); });
}
function criarSolic(vazia) {
  const itens = [];
  if (!vazia) for (const i of document.querySelectorAll("[name=cp]:checked")) {
    const [sv, mid] = i.value.split("|"), q = +document.getElementById(`cq_${sv}_${mid}`).value || 0;
    if (!(q > 0)) continue;
    const ja = itens.find(x => x.mat === mid); if (ja) ja.qtd += q; else itens.push({ mat: mid, qtd: q });
  }
  if (!vazia && !itens.length) return alert("Marque pelo menos um material.");
  const num = prompt("Número da solicitação no Sienge (pode deixar em branco e preencher depois):");
  if (num === null) return;
  const s = { id: uid(), num: num.trim(), data: hoje(), obs: "", itens };
  S.solics.push(s); save(); ir("solic", s.id);
}
function solic(C) {

  return `<div class="card"><table><tr><th>Material</th><th>Pedido</th><th>Solicitado</th><th></th></tr>
    ${s.itens.map((i, k) => `<tr><td>${esc(nomeMat(i.mat))}<span class="sub">${esc(mat(i.mat)?.cod)}</span></td><td>${fN(C.pedidoSol[s.id + "|" + i.mat])}</td>
      <td><input class="cnt" style="width:80px" type="number" step="any" min="0" value="${i.qtd}" onchange="solAtual().itens[${k}].qtd=+this.value||0;save();render()"> ${esc(unMat(i.mat))}</td>
      <td><button class="icobtn" aria-label="Tirar" onclick="solAtual().itens.splice(${k},1);save();render()">${xis}</button></td></tr>`).join("") || `<tr><td colspan="4" class="muted">Sem itens.</td></tr>`}</table>
    <form class="row" style="margin-top:10px" onsubmit="event.preventDefault();addItemSolic()"><input id="aiMat" list="dlMat" placeholder="Adicionar material" autocomplete="off"><datalist id="dlMat">${optsMat()}</datalist>
      <input id="aiQtd" class="n" style="width:80px" type="number" step="any" min="0" placeholder="Qtd"><button class="btn sm n">+</button></form></div>
  ${peds.length ? `<h2>Pedidos ligados</h2><div class="card">${peds.map(p => `<div class="it" onclick="ir('pedido','${p.id}')"><span class="lb">Pedido ${esc(p.num)}<small>${esc(p.fornecedor)}</small></span></div>`).join("")}</div>` : ""}
  <div class="field"><label>Observação</label><input value="${esc(s.obs)}" onchange="solAtual().obs=this.value;save()"></div>
  <div class="row" style="margin-bottom:10px"><button class="btn sec" onclick="copiarSolic()">Copiar lista</button><button class="btn sec" onclick="numSolic()">Número Sienge</button></div>
  <div class="row"><button class="btn sec" onclick="solAtual().fechada=!solAtual().fechada;save();render()">${s.fechada ? "Reabrir" : "Fechar solicitação"}</button><button class="btn dan" onclick="excluirSolic()">Excluir</button></div>`;
}
const solAtual = () => S.solics.find(x => x.id === sel);
function addItemSolic() {
  const m = matPorRotulo(aiMat.value); if (!m) return alert("Escolha um material da lista.");
  const q = +aiQtd.value; if (!(q > 0)) return alert("Informe a quantidade.");

}
function numSolic() { const n = prompt("Número da solicitação no Sienge:", solAtual().num); if (n !== null) { solAtual().num = n.trim(); save(); render(); } }
function excluirSolic() {
  if (!confirm("Excluir esta solicitação?")) return;
  S.pedidos.forEach(p => { if (p.solic === sel) p.solic = null; });
  S.solics = S.solics.filter(x => x.id !== sel); save(); voltar();
}
function copiarSolic() {
  const t = solAtual().itens.map(i => { const m = mat(i.mat); return `${m?.cod || "-"}\t${m?.nome}\t${fN(i.qtd)}\t${m?.un}`; }).join("\n");
  navigator.clipboard.writeText(t).then(() => alert("Lista copiada (código, nome, quantidade, unidade)."), () => prompt("Copie a lista:", t));
}

// ---------- pedido: importar PDF ----------
let novoPed = null;
async function importarPdf(f) {
  if (!f) return;
  let p;
  try {
    const pdfjs = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
    pdfjs.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
    const doc = await pdfjs.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
    const pags = [];
    for (let i = 1; i <= doc.numPages; i++) pags.push((await (await doc.getPage(i)).getTextContent()).items.map(t => ({ x: t.transform[4], y: t.transform[5], s: t.str })));
    p = lerPedido(pags);
  } catch (e) { return alert("Não consegui abrir o PDF: " + e.message); }
  if (!p.itens.length) return alert("Não encontrei itens nesse PDF. É um pedido do Sienge?");
  // o PDF traz o nome da obra: se for outra obra cadastrada, oferece trocar antes
  const N = s => s.toUpperCase().replace(/\s*-\s*ETAPA\s*\d+\s*$/, "").trim(), po = N(p.obra);
  const outra = po && listaObras().find(o => o.id !== S.obra.id && (po.includes(N(o.nome)) || N(o.nome).includes(po)));
  const daAtual = po && (po.includes(N(S.obra.nome)) || N(S.obra.nome).includes(po));
  if (outra && !daAtual && confirm(`Esse pedido é da obra ${p.obra}. Trocar para "${outra.nome}" antes de importar?`)) trocarObra(outra.id);
  if (S.pedidos.some(x => x.num === p.num) && !confirm(`O pedido ${p.num} já foi importado nesta obra. Importar de novo?`)) return;
  // sugestão de material: equivalência já gravada; senão, o único material com o mesmo código de insumo
  p.itens.forEach(it => {
    it.chave = chaveItem(it);
    const igual = S.materiais.find(m => m.apelidos?.includes(it.chave));
    const mesmoCod = S.materiais.filter(m => m.cod.split("-")[0] === it.cod);
    it.mat = igual?.id || (mesmoCod.length === 1 ? mesmoCod[0].id : "");
    it.auto = !!igual;
  });
  const etapa = (p.obra + " " + p.unidade).match(/ETAPA\s*\d+/i)?.[0] || "";
  novoPed = { ...p, etapa, obra: p.obra.replace(/\s*-\s*ETAPA\s*\d+\s*$/i, "") };
  dlgPedido();
}
function dlgPedido() {
  const p = novoPed;
  const sols = S.solics.filter(s => !s.fechada);

  const opcoes = it => {
    const cand = S.materiais.filter(m => m.cod.split("-")[0] === it.cod).sort(porNome), resto = S.materiais.filter(m => !cand.includes(m)).sort(porNome);
    const o = m => `<option value="${m.id}" ${m.id === it.mat ? "selected" : ""}>${esc(rotuloMat(m))}</option>`;
    return `<option value="">— escolher —</option><option value="novo" ${it.mat === "novo" ? "selected" : ""}>+ Material novo (cria no catálogo)</option>
      ${cand.length ? `<optgroup label="Mesmo código de insumo">${cand.map(o).join("")}</optgroup>` : ""}<optgroup label="Todos">${resto.map(o).join("")}</optgroup>`;
  };
  D.innerHTML = `<form onsubmit="event.preventDefault();salvarPedido()"><h3>Pedido ${esc(p.num)}</h3>
    <p class="muted" style="margin-top:-6px">${esc(p.fornecedor)} · ${fmt(p.data)}</p>
    <div class="row field"><div><label>Obra</label><input id="pObra" list="dlOb" value="${esc(p.obra)}"><datalist id="dlOb">${obras.map(o => `<option value="${esc(o)}">`).join("")}</datalist></div>
      <div><label>Etapa</label><input id="pEtapa" list="dlEt" value="${esc(p.etapa)}"><datalist id="dlEt">${etps.map(o => `<option value="${esc(o)}">`).join("")}</datalist></div></div>
    <div class="field"><label>Solicitação</label><select id="pSol"><option value="">Nenhuma</option>${sols.map(s => `<option value="${s.id}">${esc(s.num || "(sem número)")} · ${fmt(s.data)} · ${s.itens.length} itens</option>`).join("")}</select></div>
    <label>Itens (${p.itens.length}) — escolha o material do estoque de cada um</label>
    ${p.itens.map((it, k) => `<div class="map ${it.auto ? "" : "pend"}"><b style="font-size:14px">${esc(it.cod)} - ${esc(it.nome)} ${esc(it.comp)}</b>
      <span class="sub">${fN(it.qtd)} ${esc(it.un)}${it.prev ? " · entrega " + fmt(it.prev) : ""}${it.auto ? " · reconhecido" : ""}</span>
      <select style="margin-top:6px" onchange="novoPed.itens[${k}].mat=this.value">${opcoes(it)}</select></div>`).join("")}
    <div class="row" style="margin-top:12px"><button type="button" class="btn sec" onclick="D.close()">Cancelar</button><button class="btn">Salvar pedido</button></div></form>`;
  D.showModal();
}
function salvarPedido() {
  const p = novoPed;
  if (p.itens.some(it => !it.mat)) return alert("Escolha o material de todos os itens (ou \"Material novo\").");
  // fornecedor do pedido vira cadastro (pra guardar o prazo) e fica ligado aos materiais que ainda não têm
  let forn = S.fornecedores.find(f => f.nome.toUpperCase() === p.fornecedor.toUpperCase());
  if (!forn && p.fornecedor) S.fornecedores.push(forn = { id: uid(), nome: p.fornecedor, prazo: 0 });
  for (const it of p.itens) {
    if (it.mat === "novo") {
      const m = { id: uid(), nome: (it.nome + " " + it.comp).trim(), cod: it.cod, un: it.un, fator: 1, locais: [], apelidos: [] };
      S.materiais.push(m); it.mat = m.id;
    }
    const m = mat(it.mat);
    m.apelidos ??= []; if (!m.apelidos.includes(it.chave)) m.apelidos.push(it.chave);
    if (!m.un) m.un = it.un;
    if (!m.forn && forn) m.forn = forn.id;
  }
  const ped = { id: uid(), num: p.num, data: p.data, fornecedor: p.fornecedor, obra: pObra.value.trim(), etapa: pEtapa.value.trim(), solic: pSol.value || null, fechado: false,
    itens: p.itens.map(it => ({ mat: it.mat, qtd: it.qtd, prev: it.prev, desc: `${it.cod} - ${it.nome} ${it.comp}`.trim() })) };
  S.pedidos.push(ped); save(); D.close(); novoPed = null;
  aba.compras = "pedidos"; pilha = []; tela = "compras"; ir("pedido", ped.id);
}

function salvarReceb() {

// ---------- conferência ----------
// Contagem por local; o estoque é um só, então o material só é ajustado quando
// foi contado em todos os locais onde está. Contou 0 num local = saiu de lá.
// A primeira conferência é o estoque inicial: o ajuste leva o saldo de 0 ao contado.
let contagem = {}; // mat -> {local -> qtd}
function conferir(C) {
  titulo("Conferência", "conte o que tem em cada local");
  const locs = [...S.locais.map(l => [l.id, l.nome]), ["_", "Sem local"]].filter(([id]) => !localConf || id === localConf);
  const lista = locs.map(([lid, nome]) => {
    const ms = S.materiais.filter(m => lid === "_" ? !locsDe(m).length : m.locais?.includes(lid)).sort(porNome);
    return ms.length ? `<h2>${esc(nome)}</h2><div class="card">${ms.map(m => `<div class="it" style="cursor:default"><span class="lb">${esc(m.nome)}
      <small>no app: ${fN(C.saldo[m.id])} ${esc(m.un)}${locsDe(m).length > 1 ? " (somando " + esc(locaisDe(m)) + ")" : ""} · ${confDe(m) ? "conferido há " + dias(confDe(m), hoje()) + " dias" : "nunca conferido"}</small></span>
      <input class="cnt" type="number" step="any" min="0" placeholder="contado" value="${contagem[m.id]?.[lid] ?? ""}" oninput="(contagem['${m.id}']??={})['${lid}']=this.value"></div>`).join("")}</div>` : "";
  }).join("");
  return `<div class="field"><select onchange="localConf=this.value;render()"><option value="">Todos os locais</option>${S.locais.map(l => `<option value="${l.id}" ${l.id === localConf ? "selected" : ""}>${esc(l.nome)}</option>`).join("")}<option value="_" ${localConf === "_" ? "selected" : ""}>Sem local</option></select></div>
    <p class="muted" style="margin-top:0">Material sem local aparece em "Sem local". Pra cadastrar o estoque atual, conte aqui e depois marque onde cada um está guardado.</p>
    ${lista || `<p class="empty">Nenhum material aqui.</p>`}
    ${lista ? `<button class="btn" onclick="salvarConferencia()">Salvar conferência</button>` : ""}`;
}
function salvarConferencia() {
  const C = calc(), ajustados = [], faltam = [];
  for (const [id, cs] of Object.entries(contagem)) {
    const m = mat(id); if (!m) continue;
    const locs = locsDe(m).length ? locsDe(m) : ["_"];
    if (!locs.some(l => cs[l] !== undefined && cs[l] !== "")) continue;
    const semContar = locs.filter(l => cs[l] === undefined || cs[l] === "");
    if (semContar.length) { faltam.push(`${m.nome}: falta contar em ${semContar.map(l => S.locais.find(x => x.id === l)?.nome || "sem local").join(", ")}`); continue; }
    const total = locs.reduce((t, l) => t + (+cs[l] || 0), 0), dif = total - (C.saldo[id] || 0);
    if (Math.abs(dif) > 1e-9) S.movs.push({ id: uid(), data: hoje(), tipo: "ajuste", mat: id, qtd: dif, obs: `contado ${fN(total)}, app dizia ${fN(C.saldo[id])}` });
    if (locsDe(m).length) m.locais = m.locais.filter(l => !localDaObra(l) || +cs[l] > 0);
    (m.confs ??= {})[S.obra.id] = hoje(); ajustados.push(`${m.nome}: ${Math.abs(dif) > 1e-9 ? (dif > 0 ? "+" : "") + fN(dif) : "ok"}`);
    delete contagem[id];
  }
  if (!ajustados.length && !faltam.length) return alert("Nenhuma contagem preenchida.");
  save(); render();
  alert((ajustados.length ? "Conferidos:\n" + ajustados.join("\n") : "") + (faltam.length ? "\n\nNão salvos (o material está em mais de um local):\n" + faltam.join("\n") : ""));
}

function novaObra() {
  const n = prompt("Nome da nova obra:"); if (!n?.trim()) return;
  const id = uid(); S.obras[id] = { nome: n.trim(), ...dadosObra() };
  const copiar = S.servicos.length && confirm(`Copiar as atividades (com os materiais por casa) de "${S.obra.nome}" pra nova obra?`);
  const de = S.obra.id;
  trocarObra(id);
  if (copiar) { copiarDe(de); save(); render(); }
}
function renomearObra() { const n = prompt("Nome da obra:", S.obra.nome); if (n?.trim()) { S.obra.nome = n.trim(); save(); render(); } }
// copia as atividades de outra obra; as que já existem aqui (mesmo nome) ficam como estão
function copiarDe(origem) {
  const tem = new Set(S.servicos.map(s => s.nome.toUpperCase())), ids = {};
  const novas = dadosDe(origem).servicos.filter(s => !tem.has(s.nome.toUpperCase())).map(s => { const c = JSON.parse(JSON.stringify(s)); ids[s.id] = c.id = uid(); return c; });
  novas.forEach(c => c.apos = ids[c.apos] || "");
  S.servicos.push(...novas); return novas.length;
}
function copiarAtividades() {
  const outras = listaObras().filter(o => o.id !== S.obra.id);
  const r = outras.length === 1 ? "1" : prompt("Copiar de qual obra?\n" + outras.map((o, i) => `${i + 1} = ${o.nome}`).join("\n"));
  const o = outras[+r - 1]; if (!o) return;
  const n = copiarDe(o.id); save(); render();
  alert(n ? `${n} atividade(s) copiada(s) de ${o.nome}.` : "Todas as atividades de lá já existem aqui.");
}
function excluirObra() {
  if (prompt(`Isso apaga atividades, módulos, estoque, compras e programação de "${S.obra.nome}". Pra confirmar, digite o nome da obra:`)?.trim().toUpperCase() !== S.obra.nome.toUpperCase()) return;
  const apagar = S.obra.id, prox = listaObras().find(o => o.id !== apagar).id;
  trocarObra(prox); delete S.obras[apagar];

}

// ---------- google drive (mesmo esquema do app de Assistência) ----------
// ponytail: última versão ganha, sem mesclagem por registro. Usuário único;
// sincroniza ao abrir e 3 s depois de cada alteração.
const DRIVE = { estado: "off", erro: "", quando: null, timer: null };
const SCOPE = "https://www.googleapis.com/auth/drive.file";
function tokenValido() {
  try { const t = JSON.parse(sessionStorage.getItem("estoque_tok") || "null"); return t && t.exp > Date.now() + 60000 ? t.tok : null; } catch (e) { return null; }
}
function conectar() {
  return new Promise((res, rej) => {
    if (!S.config.driveClientId) return rej(new Error("informe o Client ID nos ajustes"));
    if (!window.google || !google.accounts) return rej(new Error("biblioteca do Google não carregou (sem internet?)"));
    google.accounts.oauth2.initTokenClient({
      client_id: S.config.driveClientId, scope: SCOPE,
      callback: r => {
        if (r.error) return rej(new Error(r.error));
        sessionStorage.setItem("estoque_tok", JSON.stringify({ tok: r.access_token, exp: Date.now() + r.expires_in * 1000 }));
        res(r.access_token);
      },
      error_callback: e => rej(new Error(e.type === "popup_closed" ? "janela fechada" : e.type || "erro"))
    }).requestAccessToken({ prompt: "" });
  });
}
async function dapi(path, opts = {}, upload = false) {
  const tok = tokenValido(); if (!tok) throw new Error("não conectado");
  const r = await fetch((upload ? "https://www.googleapis.com/upload/drive/v3/" : "https://www.googleapis.com/drive/v3/") + path,
    Object.assign({}, opts, { headers: Object.assign({ Authorization: "Bearer " + tok }, opts.headers || {}) }));
  if (r.status === 401) { sessionStorage.removeItem("estoque_tok"); throw new Error("sessão expirou, conecte de novo"); }
  if (!r.ok) { let msg = ""; try { msg = (await r.json()).error.message; } catch (e) { } throw new Error("Drive respondeu " + r.status + (msg ? ": " + msg : "")); }
  return r;
}
const dBuscar = async (nome, pasta) => {
  const q = `name='${nome}' and trashed=false` + (pasta ? ` and '${pasta}' in parents` : "");
  return (await (await dapi("files?q=" + encodeURIComponent(q) + "&fields=files(id,modifiedTime)")).json()).files[0] || null;
};
async function dCriar(nome, blob, pasta, mime) {
  const meta = { name: nome, parents: pasta ? [pasta] : [] };
  if (!blob) meta.mimeType = "application/vnd.google-apps.folder";
  const fd = new FormData();
  fd.append("metadata", new Blob([JSON.stringify(meta)], { type: "application/json" }));
  if (blob) fd.append("file", new Blob([blob], { type: mime }));
  const r = await dapi(blob ? "files?uploadType=multipart&fields=id" : "files?fields=id", { method: "POST", body: blob ? fd : JSON.stringify(meta), headers: blob ? {} : { "Content-Type": "application/json" } }, !!blob);
  return (await r.json()).id;
}
const dAtualizar = (id, blob, mime) => dapi("files/" + id + "?uploadType=media", { method: "PATCH", body: blob, headers: { "Content-Type": mime } }, true);
async function sincronizar(interativo) {
  if (DRIVE.estado === "busy") return;
  let mudou = false;
  try {
    if (!tokenValido()) { if (!interativo) return; await conectar(); }
    DRIVE.estado = "busy"; cabecalho();
    const p = await dBuscar("Controle de Estoque"), pasta = p ? p.id : await dCriar("Controle de Estoque", null);
    const arq = await dBuscar("estoque.json", pasta);
    let subir = !arq;
    if (arq) {
      const remoto = migrar(JSON.parse(await (await dapi("files/" + arq.id + "?alt=media")).text()));
      const rs = remoto.meta.salvoEm || "", ls = S.meta.salvoEm || "";
      if (rs > ls) { remoto.config.driveClientId ||= S.config.driveClientId; S = remoto; localStorage.setItem(KEY, JSON.stringify(S)); mudou = true; }
      else if (ls > rs) subir = true;
    }
    if (subir) {
      const blob = new Blob([JSON.stringify(S)], { type: "application/json" });
      if (arq) await dAtualizar(arq.id, blob, "application/json"); else await dCriar("estoque.json", blob, pasta, "application/json");
    }
    DRIVE.estado = "sync"; DRIVE.quando = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  } catch (e) {
    DRIVE.estado = tokenValido() ? "err" : "off"; DRIVE.erro = e.message;
    if (interativo) alert("Não sincronizou: " + e.message);
  }
  if (mudou || tela === "ajustes") render(); else cabecalho();
}
function agendarSync() {
  if (!tokenValido()) return;
  clearTimeout(DRIVE.timer);
  DRIVE.timer = setTimeout(() => sincronizar(false), 3000);
}
function cabecalho() {
  btnDrive.className = "icobtn " + DRIVE.estado;
  btnDrive.title = { off: "Conectar ao Google Drive", sync: "Sincronizado" + (DRIVE.quando ? " às " + DRIVE.quando : ""), busy: "Sincronizando…", err: "Erro: " + DRIVE.erro }[DRIVE.estado];
}
btnDrive.onclick = () => { if (!S.config.driveClientId) { ir("ajustes"); return alert("Cole o Client ID do Google nos ajustes pra conectar ao Drive."); } sincronizar(true); };
